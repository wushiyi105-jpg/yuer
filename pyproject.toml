[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "yuer"
version = "0.1.0"
description = "育儿 · 生长与喂养参考 · 百分位、矫正月龄、疫苗日历、问诊清单"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
yuer = "yuer.cli:main"

[tool.setuptools]
packages = ["yuer"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
