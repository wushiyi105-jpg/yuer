[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yuer"
version = "1.0.0"
description = "育儿成长与疫苗：WHO 百分位、月龄剂次、到期提醒"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "shiyi", email = "wushiyi105@gmail.com" }]
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9",
  "pydantic>=2.7", "pydantic-settings>=2.3", "httpx>=0.27", "jinja2>=3.1",
  "typer>=0.12", "rich>=13.7", "sqlalchemy>=2.0", "alembic>=1.13",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
yuer = "yuer.iface.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["yuer"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["yuer"]
branch = true

[tool.coverage.report]
omit = ["yuer/__main__.py"]

