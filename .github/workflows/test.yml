name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install deps
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy yuer tests/test_app_fake.py

      - name: Test
        env:
          YER_DB_PATH: data/test.db
        run: uv run pytest -q

      - name: Coverage
        env:
          YER_DB_PATH: data/test.db
        run: |
          uv run coverage run -m pytest -q
          uv run coverage report --fail-under=70

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t ci-app .
      - name: Run and check /health
        run: |
          docker run -d --name ci-app -p 8022:8022 ci-app
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8022/health >/dev/null; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then docker logs ci-app; exit 1; fi
